<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Rounded Background with safe zone padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Glowing Accent Aura -->
  <circle cx="256" cy="230" r="150" fill="#38bdf8" opacity="0.15"/>

  <!-- Main Speech Bubble Shape -->
  <g filter="url(#shadow)">
    <path d="M140 140 C140 100, 372 100, 372 140 L372 270 C372 310, 290 310, 270 310 L220 355 C212 362, 200 356, 200 345 L200 310 C150 310, 140 290, 140 270 Z" 
          fill="url(#bubbleGrad)"/>
    
    <!-- White English 'A' and Bengali 'অ' / Sound Waves Symbol -->
    <text x="210" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#ffffff" text-anchor="middle">F</text>
    <text x="295" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#fef08a" text-anchor="middle">অ</text>

    <!-- Star / Fluency Sparkle -->
    <path d="M370 120 L378 140 L398 148 L378 156 L370 176 L362 156 L342 148 L362 140 Z" fill="url(#accentGrad)"/>
    <path d="M140 280 L145 292 L157 297 L145 302 L140 314 L135 302 L123 297 L135 292 Z" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Bottom Brand Label Ribbon -->
  <g transform="translate(0, 385)">
    <rect x="110" y="0" width="292" height="52" rx="26" fill="#ffffff" opacity="0.95" filter="url(#shadow)"/>
    <text x="256" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#1e3a8a" text-anchor="middle" letter-spacing="2">FLUENTLY</text>
  </g>
</svg>
